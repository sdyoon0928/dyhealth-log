<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B23">
<title>DY 헬스 로그</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ══════════ 로그인 · 회원가입 화면 ══════════ -->
<div class="auth" id="authView" hidden>
  <div class="auth__card">

    <div class="auth__brand">DY <em>헬스 로그</em></div>
    <p class="auth__tag">매일의 수치를 남기면, 상태를 대신 읽어드립니다.</p>

    <!-- 로그인 / 회원가입 전환 -->
    <div class="seg" id="seg">
      <button class="is-on" data-mode="login">로그인</button>
      <button data-mode="register">회원가입</button>
    </div>

    <div class="field" id="fieldNick" hidden>
      <label for="aNick">이름</label>
      <input id="aNick" type="text" autocomplete="nickname" placeholder="동윤">
    </div>

    <div class="field">
      <label for="aEmail">이메일</label>
      <input id="aEmail" type="email" inputmode="email"
             autocomplete="email" placeholder="dy@example.com">
    </div>

    <div class="field">
      <label for="aPw">비밀번호 <span id="pwHint" hidden>8자 이상</span></label>
      <input id="aPw" type="password" autocomplete="current-password"
             placeholder="••••••••">
    </div>

    <p class="auth__err" id="authErr" hidden></p>

    <button class="btn btn--primary" id="btnAuth">로그인</button>
  </div>
</div>


<!-- ══════════ 앱 본 화면 ══════════ -->
<div class="phone" id="appView" hidden>

  <header class="appbar">
    <div class="appbar__brand">DY <em>헬스 로그</em></div>
    <div class="appbar__user">
      <span id="meName"></span>
      <button class="ghost-btn" id="btnLogout">로그아웃</button>
    </div>
  </header>

  <nav class="chips" id="chips">
    <button class="chip is-on" data-days="0">전체</button>
    <button class="chip" data-days="7">최근 7일</button>
    <button class="chip" data-days="30">최근 30일</button>
  </nav>

  <main class="feed" id="feed"></main>

  <button class="fab" id="fabAdd" aria-label="기록 추가">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" fill="none"/>
    </svg>
  </button>
</div>


<!-- ══════════ 바텀시트: 기록 추가 ══════════ -->
<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheetLog" hidden aria-labelledby="sheetLogTitle">
  <div class="sheet__grip"></div>
  <header class="sheet__head">
    <h2 id="sheetLogTitle">오늘의 기록</h2>
    <button class="icon-btn" data-close aria-label="닫기">✕</button>
  </header>

  <div class="sheet__body">
    <div class="field">
      <label for="fDate">측정일</label>
      <input id="fDate" type="date">
    </div>

    <div class="grid2">
      <div class="field">
        <label for="fWeight">몸무게 <span>kg</span></label>
        <input id="fWeight" type="number" inputmode="decimal"
               step="0.1" min="0.1" max="499.9" placeholder="68.5">
      </div>
      <div class="field">
        <label for="fHeight">키 <span>cm</span></label>
        <input id="fHeight" type="number" inputmode="decimal"
               step="0.1" min="50.1" max="299.9" placeholder="170">
      </div>
    </div>

    <div class="grid2">
      <div class="field">
        <label for="fSys">수축기 혈압 <span>60~180</span></label>
        <input id="fSys" type="number" inputmode="numeric"
               step="1" min="60" max="180" placeholder="120">
      </div>
      <div class="field">
        <label for="fDia">이완기 혈압 <span>40~120</span></label>
        <input id="fDia" type="number" inputmode="numeric"
               step="1" min="40" max="120" placeholder="80">
      </div>
    </div>

    <div class="field">
      <label for="fSugar">공복 혈당 <span>mg/dL · 40~400</span></label>
      <input id="fSugar" type="number" inputmode="numeric"
             step="1" min="40" max="400" placeholder="95">
    </div>

    <div class="grid2">
      <div class="field">
        <label for="fSteps">걸음 수 <span>최대 30,000 · 선택</span></label>
        <input id="fSteps" type="number" inputmode="numeric"
               step="1" min="0" max="30000" placeholder="8000">
      </div>
      <div class="field">
        <label for="fSleep">수면 <span>시간 · 선택</span></label>
        <input id="fSleep" type="number" inputmode="decimal"
               step="0.1" min="0" max="24" placeholder="7.5">
      </div>
    </div>

    <div class="field">
      <label for="fMemo">메모 <span>선택</span></label>
      <textarea id="fMemo" rows="2" placeholder="오늘 컨디션은..."></textarea>
    </div>
  </div>

  <footer class="sheet__foot">
    <button class="btn btn--primary" id="btnSave">기록 저장</button>
  </footer>
</section>


<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
